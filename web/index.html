<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCS for Create · HMI</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#26303d; --txt:#c9d4e3;
    --dim:#6b7a8d; --run:#37d67a; --stop:#4a5666; --alarm:#ff4d4f; --ok:#2dd4bf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;
         background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px}
  h1 small{color:var(--dim);font-weight:400;margin-left:8px;font-size:12px}
  .spacer{flex:1}
  .link{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--alarm);transition:.3s}
  .dot.on{background:var(--run);box-shadow:0 0 8px var(--run)}
  #alarmbar{margin:12px 18px 0;padding:10px 14px;border-radius:6px;font-size:13px;
            background:#16241c;border:1px solid #1f4030;color:var(--ok)}
  #alarmbar.active{background:#2a1414;border-color:#5c2020;color:#ffb3b3}
  #alarmbar b{color:var(--alarm)}
  main{padding:14px 18px 40px;display:grid;gap:12px;
       grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .group-title{grid-column:1/-1;color:var(--dim);font-size:12px;letter-spacing:1px;
               margin:8px 0 -4px;text-transform:uppercase}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
        display:flex;flex-direction:column;gap:8px;min-height:104px}
  .card.hit{border-color:var(--alarm);box-shadow:0 0 0 1px var(--alarm) inset}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .addr{font:12px/1 ui-monospace,Consolas,monospace;color:var(--dim);letter-spacing:.5px}
  .desc{font-size:13px;color:var(--txt)}
  .val{font:600 22px/1.1 ui-monospace,Consolas,monospace;display:flex;align-items:center;gap:8px}
  .val.off{color:var(--stop)} .val.on{color:var(--run)}
  .val .lamp{width:10px;height:10px;border-radius:2px;background:var(--stop)}
  .val.on .lamp{background:var(--run);box-shadow:0 0 10px var(--run)}
  button{background:#1f2937;color:var(--txt);border:1px solid var(--line);border-radius:6px;
         padding:8px 10px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--ok);color:#fff}
  button.on{background:#12352a;border-color:var(--run);color:#9ff0bf}
  button:disabled{opacity:.4;cursor:not-allowed}
  input[type=range]{width:100%;accent-color:var(--ok)}
  input[type=number]{width:88px;background:#0d1117;color:var(--txt);border:1px solid var(--line);
                     border-radius:6px;padding:6px 8px;font:600 16px ui-monospace,monospace}
  #logwrap{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:8px;
           padding:10px 14px;max-height:190px;overflow:auto}
  .logtitle{color:var(--dim);font-size:12px;letter-spacing:1px;margin-bottom:6px}
  .panel{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:12px 14px}
  .olog{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .olog label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
  .olog input,.olog select{background:#0d1117;border:1px solid var(--line);color:var(--txt);
              border-radius:6px;padding:7px 9px;font:13px ui-monospace,Consolas,monospace;min-width:150px}
  #jobs .job{display:flex;gap:12px;font:12px ui-monospace,Consolas,monospace;padding:4px 0;
             border-bottom:1px dashed var(--line)}
  #jobs .st-run{color:var(--ok)} #jobs .st-ok{color:#7fb2ff} #jobs .st-bad{color:var(--alarm)}
  .olog input:focus{outline:none;border-color:var(--ok)}
  .hint{color:var(--dim);font-size:12px;margin-left:auto}
  #stock{display:flex;flex-wrap:wrap;gap:8px;max-height:132px;overflow:auto;margin-top:8px}
  .chip{display:inline-flex;gap:6px;align-items:center;background:#0f1621;border:1px solid var(--line);
        border-radius:999px;padding:4px 10px;font:12px ui-monospace,Consolas,monospace;cursor:pointer}
  .chip:hover{border-color:var(--ok)}
  .chip b{color:var(--ok)} .chip.low b{color:var(--alarm)}
  .rule{display:flex;gap:10px;align-items:baseline;font:12px ui-monospace,Consolas,monospace;
        padding:4px 0;border-bottom:1px dashed var(--line)}
  .rule .low{color:var(--alarm)}
  #log{font:12px/1.7 ui-monospace,Consolas,monospace;color:var(--dim);white-space:pre-wrap}
  #log .t{color:#4b5a6b;margin-right:8px}
  #log .e{color:#ffb3b3} #log .w{color:#ffd98a} #log .i{color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>PCS for Create <small id="area">—</small></h1>
  <div class="spacer"></div>
  <div class="link"><span class="dot" id="dot"></span><span id="linktxt">CC 离线</span></div>
</header>

<div id="alarmbar">无报警</div>

<main id="grid">
  <div class="panel">
    <div class="olog">
      <label>物品 id<input id="oitem" list="itemlist" placeholder="minecraft:iron_ingot"></label>
      <label>数量<input id="oqty" type="number" value="16" min="1" max="256"></label>
      <label>包裹地址<input id="oaddr" placeholder="workshop（可空）"></label>
      <button id="ogo">下单</button>
      <span class="hint" id="ohint">等电脑上报外设…</span>
    </div>
    <datalist id="itemlist"></datalist>
    <div class="logtitle" style="margin-top:10px">库存快照 <span id="stockcount" class="addr"></span></div>
    <div id="stock"></div>
    <div class="logtitle" style="margin-top:10px">自动补货规则 <span id="rulecount" class="addr"></span></div>
    <div id="rules"></div>
  </div>
  <div class="panel">
    <div class="olog">
      <label>生产配方<select id="precipe"></select></label>
      <label>数量<input id="pcount" type="number" value="8" min="1" max="512"></label>
      <button id="pgo">下单生产</button>
      <span class="hint" id="phint">等配方…</span>
    </div>
    <div class="logtitle" style="margin-top:10px">工单 <span id="jobcount" class="addr"></span></div>
    <div id="jobs"></div>
  </div>
  <div id="logwrap"><div class="logtitle">事件</div><div id="log"></div></div>
</main>

<script>
const WS_PORT = 8765;
const $ = s => document.querySelector(s);
let ws, tags = [], byId = {}, values = {}, alarmCodes = new Set();
const key = id => 'k' + id.replace(/[^a-zA-Z0-9]/g, '_');

function log(kind, text){
  const d = document.createElement('div');
  const t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  const cls = {err:'e', warn:'w', info:'i'}[kind] || '';
  d.innerHTML = `<span class="t">${t}</span><span class="${cls}">${text}</span>`;
  const box = $('#log');
  box.prepend(d);
  while (box.childElementCount > 200) box.lastChild.remove();
}

function setLink(on){
  $('#dot').classList.toggle('on', on);
  $('#linktxt').textContent = on ? 'CC 在线' : 'CC 离线';
}

function human(t, v){
  if (v === undefined || v === null) return '—';
  if (t.type === 'bool') return v ? '1' : '0';
  if (t.type === 'int') return String(v);
  return Number(v).toFixed(1);
}

function renderStock(items){
  const box = $('#stock'), dl = $('#itemlist');
  box.innerHTML = ''; dl.innerHTML = '';
  const list = Object.entries(items || {}).sort((a, b) => b[1] - a[1]);
  $('#stockcount').textContent = list.length ? `${list.length} 种物品` : '（没有仓储发报机的数据）';
  list.forEach(([n, c]) => {
    const o = document.createElement('option'); o.value = n; dl.appendChild(o);
  });
  list.slice(0, 80).forEach(([n, c]) => {
    const el = document.createElement('span');
    el.className = 'chip' + (c <= 0 ? ' low' : '');
    el.innerHTML = `<b>${c}</b>${n.replace(/^minecraft:/, '')}`;
    el.onclick = () => { $('#oitem').value = n; };
    box.appendChild(el);
  });
}

let RECIPES = [];

function renderRecipes(list){
  RECIPES = list || [];
  const sel = $('#precipe');
  sel.innerHTML = '';
  RECIPES.forEach(r => {
    const o = document.createElement('option');
    o.value = r.id;
    const ins = (r.inputs || []).map(i => `${(i.item || '').replace(/^[a-z_]+:/, '')}×${i.per}`).join(' + ');
    const out = (r.output && r.output.item || '').replace(/^[a-z_]+:/, '');
    o.textContent = `${r.name || r.id}：${ins} → ${out}`;
    sel.appendChild(o);
  });
  $('#phint').textContent = RECIPES.length ? `${RECIPES.length} 个配方` : '（没配配方）';
}

function renderJobs(list){
  const box = $('#jobs');
  box.innerHTML = '';
  const arr = (list || []).slice().reverse();
  arr.forEach(j => {
    const el = document.createElement('div');
    el.className = 'job';
    const cls = j.state === '已出货' ? 'st-ok' : (j.state === '生产中' ? 'st-run' : 'st-bad');
    const t = new Date(j.ts * 1000).toLocaleTimeString('zh-CN', {hour12: false});
    el.innerHTML = `<span class="addr">#${j.id} ${t}</span>` +
      `<span>${j.name} ×${j.count}</span>` +
      `<span class="${cls}">${j.state}</span>` +
      `<span class="addr">基线 ${j.baseline}</span>`;
    box.appendChild(el);
  });
  $('#jobcount').textContent = arr.length ? `${arr.length} 张` : '（无）';
}

function produce(){
  const sel = $('#precipe');
  if (!sel.value){ log('warn', '没有可选配方'); return; }
  const count = Math.max(1, Math.min(512, +$('#pcount').value || 1));
  send({dir: 'produce', recipe: sel.value, count});
  log('info', `工单 ${sel.value} × ${count}`);
}

function renderRules(list){
  const box = $('#rules');
  box.innerHTML = '';
  const arr = list || [];
  arr.forEach(r => {
    const el = document.createElement('div');
    el.className = 'rule';
    const has = r.stock !== null && r.stock !== undefined;
    const low = has && r.stock < r.low;
    el.innerHTML = `<span class="${low ? 'low' : ''}">${(r.item || '').replace(/^minecraft:/, '')}</span>` +
      `<span class="addr">库存 ${has ? r.stock : '—'} · ${low ? '低于' : '安全'} ${r.low} → 补 ${r.qty}` +
      (r.address ? ` → ${r.address}` : '') + `</span>`;
    box.appendChild(el);
  });
  $('#rulecount').textContent = arr.length ? `${arr.length} 条` : '（未配置）';
}

function renderCaps(c){
  c = c || {};
  $('#ohint').textContent = c.requester ? '红石请求器就绪（setRequest + request）'
    : c.ticker ? '仓储发报机就绪（requestFiltered 过滤器下单）'
    : '电脑上没找到下单外设 —— 检查电脑是否贴着请求器/发报机';
}

function placeOrder(){
  const name = $('#oitem').value.trim();
  const count = Math.max(1, Math.min(256, +$('#oqty').value || 1));
  const address = $('#oaddr').value.trim();
  if (!name){ log('warn', '先填物品 id 或点一个库存芯片'); return; }
  send({dir: 'order', items: [{name, count}], address});
  log('info', `订单 ${name} × ${count} → ${address || '(默认地址)'}`);
}

function buildCard(t){
  const el = document.createElement('div');
  el.className = 'card'; el.id = key(t.id);
  el.innerHTML = `
    <div class="top"><span class="addr">${t.id}</span>
      <span class="addr">${t.kind || ''}</span></div>
    <div class="desc">${t.desc || ''}</div>
    <div class="val" data-val><span class="lamp"></span><span data-num>—</span>
      <span class="addr" data-unit>${t.unit || ''}</span></div>
    <div data-ctl></div>`;
  const ctl = el.querySelector('[data-ctl]');
  if (t.type === 'pulse'){
    el.querySelector('[data-val]').innerHTML =
      `<span class="addr">脉冲 ${t.pulse_ms || 150}ms` +
      (t.watch ? ` · 监视 ${t.watch}` : '') + `</span>`;
    const b = document.createElement('button');
    b.textContent = '发请求';
    b.onclick = () => send({dir:'cmd', topic:t.id, value:true});
    ctl.appendChild(b);
  } else if (t.ro){
    ctl.remove();
  } else if (t.type === 'bool' && (t.io === 'output' || t.io === 'internal')){
    const b = document.createElement('button');
    b.textContent = '—';
    b.onclick = () => send({dir:'cmd', topic:t.id, value: !values[t.id]});
    ctl.appendChild(b);
  } else if (t.io === 'internal' && t.type === 'int'){
    const i = document.createElement('input');
    i.type = 'number'; i.step = 1; i.onchange = () => send({dir:'cmd', topic:t.id, value:+i.value});
    ctl.appendChild(i);
  } else if (t.io === 'internal' && t.type === 'real'){
    const r = document.createElement('input');
    r.type = 'range'; r.min = 0; r.max = 100; r.step = 1;
    r.oninput = () => { el.querySelector('[data-num]').textContent = (+r.value).toFixed(1); };
    r.onchange = () => send({dir:'cmd', topic:t.id, value:+r.value});
    ctl.appendChild(r);
  }
  return el;
}

function paint(t){
  const el = document.getElementById(key(t.id));
  if (!el) return;
  if (t.type === 'pulse'){
    const b = el.querySelector('button');
    if (b && values[t.id]){
      b.classList.add('on');
      setTimeout(() => b.classList.remove('on'), 200);
    }
    return;
  }
  const v = values[t.id];
  const num = el.querySelector('[data-num]');
  const val = el.querySelector('[data-val]');
  if (t.type === 'bool'){
    val.classList.toggle('on', !!v);
    val.classList.toggle('off', !v);
    const b = el.querySelector('button');
    if (b){
      b.textContent = v ? (t.on_label || '通') : (t.off_label || '断');
      b.classList.toggle('on', !!v);
    }
  } else {
    val.classList.remove('on','off');
    const r = el.querySelector('input[type=range]');
    if (r && v !== undefined) r.value = v;
    const i = el.querySelector('input[type=number]');
    if (i && v !== undefined && document.activeElement !== i) i.value = v;
  }
  num.textContent = human(t, v);
}

function renderMeta(m){
  tags = m.tags || []; byId = {};
  const grid = $('#grid');
  [...grid.querySelectorAll('.card,.group-title')].forEach(n => n.remove());
  const anchor = $('#logwrap');
  const groups = {};
  tags.forEach(t => { (groups[t.io] = groups[t.io] || []).push(t); });
  const order = [['input','输入 / 现场信号'],['output','输出 / 执行机构'],['internal','内部存储区']];
  order.forEach(([k, title]) => {
    if (!groups[k]) return;
    const h = document.createElement('div');
    h.className = 'group-title'; h.textContent = title;
    grid.insertBefore(h, anchor);
    groups[k].forEach(t => { byId[t.id] = t; grid.insertBefore(buildCard(t), anchor); paint(t); });
  });
  $('#area').textContent = '· ' + (m.area || '');
}

function renderAlarms(list){
  const bar = $('#alarmbar');
  const codes = new Set((list || []).map(a => a.code));
  (list || []).forEach(a => {
    if (!alarmCodes.has(a.code)) log('err', `[${a.prio}] ${a.code} ${a.msg}`);
  });
  [...alarmCodes].forEach(c => { if (!codes.has(c)) log('info', `报警消除 ${c}`); });
  alarmCodes = codes;
  tags.forEach(t => {
    const el = document.getElementById(key(t.id));
    if (el) el.classList.toggle('hit', (list||[]).some(a => a.tag === t.id));
  });
  if (!list || !list.length){
    bar.className = ''; bar.textContent = '无报警';
  } else {
    bar.className = 'active';
    bar.innerHTML = `<b>${list.length} 条报警</b> · ` +
      list.map(a => `${a.prio} ${a.code} ${a.msg}`).join(' · ');
  }
}

function send(obj){
  if (!ws || ws.readyState !== 1) { log('warn', '网页没连上服务端'); return; }
  ws.send(JSON.stringify(obj));
  log('info', `下发 ${obj.topic} = ${obj.value}`);
}

function handle(m){
  switch (m.dir){
    case 'meta': renderMeta(m); log('info', `载入 ${m.tags.length} 个标签`); break;
    case 'state':
      Object.entries(m.tags).forEach(([k, v]) => {
        const t = byId[k]; const old = values[k];
        values[k] = v;
        if (t) paint(t);
        if (t && old !== undefined && old !== v) log('info', `${k} ${human(t, old)} → ${human(t, v)}`);
      });
      break;
    case 'alarm': renderAlarms(m.active); break;
    case 'link': setLink(m.mc > 0); break;
    case 'warn': log('warn', m.msg); break;
    case 'stock': renderStock(m.items); break;
    case 'rules': renderRules(m.rules); break;
    case 'recipes': renderRecipes(m.recipes); break;
    case 'jobs': renderJobs(m.jobs); break;
    case 'caps': renderCaps(m.caps); break;
    case 'result': log(m.ok ? 'info' : 'err',
                       (m.ok ? '下单回执：' : '下单失败：') + (m.msg || '')); break;
  }
}

function connect(){
  const url = `ws://${location.hostname}:${WS_PORT}/ws/web`;
  ws = new WebSocket(url);
  ws.onopen = () => log('info', '已连上 ' + url);
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch(_){} };
  ws.onclose = () => { setLink(false); log('warn', '服务端断开，2 秒后重连'); setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
}
document.addEventListener('DOMContentLoaded', () => {
  const go = document.getElementById('ogo');
  if (go) go.onclick = placeOrder;
  const pgo = document.getElementById('pgo');
  if (pgo) pgo.onclick = produce;
  const item = document.getElementById('oitem');
  if (item) item.addEventListener('keydown', e => { if (e.key === 'Enter') placeOrder(); });
});
connect();
</script>
</body>
</html>
